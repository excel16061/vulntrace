[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulntrace"
version = "0.1.0"
description = "Evidence-driven vulnerability analysis and regression verification (research prototype)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101"]  # assert is used in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"examples/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = false
files = ["src/vulntrace"]
